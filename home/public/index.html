<script src="/ciel-mark.js?v=1"></script>
<script>
// The living mark replaces the still one once the engine is here. The large
// mark is the whole instrument; the header glyph is only its core. Both rest
// idle and wake to listening while the launcher is hovered or focused.
if (window.CielSymbol2) {
  const launcher = document.querySelector('.orbital');
  const marks = [
    {canvas: launcher.querySelector('canvas'), core: false},
    {canvas: document.querySelector('.brand-mark canvas'), core: true},
  ];
  for (const m of marks) { m.inst = new CielSymbol2(m.canvas, {concept: 'final'}); m.inst.coreOnly = m.core; }
  document.documentElement.classList.add('mark-on');
  const attend = on => { for (const m of marks) on ? m.inst.wake() : m.inst.setState('idle'); };
  launcher.addEventListener('pointerenter', () => attend(true));
  launcher.addEventListener('pointerleave', () => attend(launcher.matches(':focus-visible')));
  launcher.addEventListener('focus', () => attend(launcher.matches(':focus-visible')));
  launcher.addEventListener('blur', () => attend(launcher.matches(':hover')));
  // Returning through the back-forward cache must not leave it listening.
  addEventListener('pageshow', () => attend(false));
  new ResizeObserver(() => { for (const m of marks) m.inst.resize(); }).observe(marks[0].canvas);
  let last = performance.now();
  const frame = now => {
    const dt = Math.min(.05, (now - last) / 1000); last = now;
    for (const m of marks) m.inst.tick(dt);
    requestAnimationFrame(frame);
  };
  requestAnimationFrame(frame);
}
</script>
