<main class="utility" id="main" tabindex="-1"><a class="back-link" href="{{HOME_ORIGIN}}/toolbox">← Toolbox</a><div class="utility-heading"><h1>Timer</h1><p>A stopwatch, countdown, and focus timer.</p><span class="local-note">On your device · nothing uploaded</span></div><noscript><p class="notice">Enable JavaScript to use this tool. Processing happens in your browser.</p></noscript><section class="work-panel timer-panel"><label>Mode<select id="timer-mode"><option value="countdown">Countdown</option><option value="stopwatch">Stopwatch</option><option value="focus">Focus</option></select></label><div id="timer-duration" class="fields"><label>Minutes<input id="timer-minutes" type="number" value="5" min="0" max="1440"></label><label>Seconds<input id="timer-seconds" type="number" value="0" min="0" max="59"></label></div><div id="timer-presets" class="actions" hidden><button class="chip" data-minutes="25">Focus · 25 min</button><button class="chip" data-minutes="5">Break · 5 min</button><button class="chip" data-minutes="15">Long break · 15 min</button></div><output id="timer-display" class="clock-display" aria-label="Elapsed or remaining time">05:00.0</output><div class="actions"><button id="timer-start" class="chip gold">Start</button><button id="timer-reset" class="chip">Reset</button><button id="timer-lap" class="chip" hidden>Lap</button></div><label class="check"><input id="timer-sound" type="checkbox" checked> Sound on finish</label><p class="hint">Keep this tab open. Background tabs may delay the finish sound.</p><ol id="timer-laps"></ol></section><p id="status" class="status" role="status" aria-live="polite"></p></main>
