<main class="utility" id="main" tabindex="-1"><a class="back-link" href="{{HOME_ORIGIN}}/toolbox">← Toolbox</a><div class="utility-heading"><h1>Password Generator</h1><p>Passwords and passphrases, generated on this device.</p><span class="local-note">On your device · nothing uploaded</span></div><noscript><p class="notice">Enable JavaScript to use this tool. Processing happens in your browser.</p></noscript><section class="work-panel narrow-panel"><div class="tabs" role="group" aria-label="Password type"><button id="password-mode" class="chip" aria-pressed="true">Password</button><button id="phrase-mode" class="chip" aria-pressed="false">Passphrase</button></div><div id="password-options"><label>Length<input id="password-length" type="number" min="8" max="128" value="24"></label><div class="checks"><label class="check"><input id="password-upper" type="checkbox" checked> Uppercase</label><label class="check"><input id="password-lower" type="checkbox" checked> Lowercase</label><label class="check"><input id="password-digits" type="checkbox" checked> Numbers</label><label class="check"><input id="password-symbols" type="checkbox" checked> Symbols</label></div></div><div id="phrase-options" hidden><div class="fields"><label>Words<input id="phrase-count" type="number" min="4" max="12" value="8"></label><label>Separator<select id="phrase-separator"><option value="-">Hyphen</option><option value=" ">Space</option><option value=".">Period</option></select></label></div></div><button id="password-generate" class="chip gold">Generate</button><label>Result<textarea id="password-output" rows="3" readonly spellcheck="false" autocomplete="off"></textarea></label><div class="actions"><button id="password-copy" class="chip">Copy result</button><button id="password-clear" class="chip">Clear</button></div><p class="hint">Uses your device’s secure random source. Results are never saved by this page. Passphrases use EFF’s 1,296-word list.</p></section><p id="status" class="status" role="status" aria-live="polite"></p></main>
