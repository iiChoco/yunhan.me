<main class="utility" id="main" tabindex="-1"><a class="back-link" href="{{HOME_ORIGIN}}/toolbox">← Toolbox</a><div class="utility-heading"><h1>Color Picker</h1><p>Pick colors, convert formats, and check text contrast.</p><span class="local-note">On your device · nothing uploaded</span></div><noscript><p class="notice">Enable JavaScript to use this tool. Processing happens in your browser.</p></noscript><div class="columns"><section class="work-panel"><label>Pick a color<input id="color-picker" type="color" value="#a0f0ff"></label><label>HEX, RGB, or HSL<input id="color-input" type="text" value="#a0f0ff" spellcheck="false"></label><button id="color-convert" class="chip gold">Convert color</button><div id="color-swatch" class="color-swatch"></div><label>HEX<input id="color-hex" readonly></label><label>RGB<input id="color-rgb" readonly></label><label>HSL<input id="color-hsl" readonly></label><button id="color-copy" class="chip">Copy HEX</button></section><section class="work-panel"><h2>Contrast check</h2><div class="fields"><label>Text color<input id="contrast-fg" type="color" value="#a0f0ff"></label><label>Background<input id="contrast-bg" type="color" value="#030608"></label></div><div id="contrast-preview" class="contrast-preview"><strong>Readable by design.</strong><p>This is sample text at a normal reading size.</p></div><output id="contrast-ratio" class="big-output"></output><p id="contrast-grade" class="hint"></p></section></div><p id="status" class="status" role="status" aria-live="polite"></p></main>
