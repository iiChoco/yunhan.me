<main class="utility" id="main" tabindex="-1"><a class="back-link" href="{{HOME_ORIGIN}}/toolbox">← Toolbox</a><div class="utility-heading"><h1>JSON Formatter</h1><p>Format, validate, minify, and search JSON.</p><span class="local-note">On your device · nothing uploaded</span></div><noscript><p class="notice">Enable JavaScript to use this tool. Processing happens in your browser.</p></noscript><div class="columns"><section class="work-panel"><label>JSON input<textarea id="json-input" rows="16" spellcheck="false" maxlength="1000000" placeholder='{"hello": "world"}'></textarea></label><div class="actions"><button id="json-format" class="chip gold">Format</button><button id="json-minify" class="chip">Minify</button><button id="json-validate" class="chip">Validate</button><label>Indent<select id="json-indent"><option value="2">2 spaces</option><option value="4">4 spaces</option></select></label></div></section><section class="work-panel"><label>Output<textarea id="json-output" rows="16" readonly spellcheck="false"></textarea></label><div class="actions"><button id="json-copy" class="chip">Copy JSON</button><button id="json-download" class="chip">Download JSON</button></div><div class="fields"><label>Search output<input id="json-search" type="search"></label><button id="json-find" class="chip">Find next</button></div><p id="json-found" class="hint"></p></section></div><p id="status" class="status" role="status" aria-live="polite"></p></main>
