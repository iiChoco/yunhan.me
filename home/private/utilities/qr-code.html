<main class="utility" id="main" tabindex="-1"><a class="back-link" href="{{HOME_ORIGIN}}/toolbox">← Toolbox</a><div class="utility-heading"><h1>QR Code</h1><p>Turn text or a link into a scannable code.</p><span class="local-note">On your device · nothing uploaded</span></div><noscript><p class="notice">Enable JavaScript to use this tool. Processing happens in your browser.</p></noscript><div class="columns"><section class="work-panel"><label>Text or URL<textarea id="qr-text" rows="5" maxlength="4000" placeholder="https://yunhan.me"></textarea></label><div class="fields"><label>Error correction<select id="qr-level"><option value="L">Low · 7%</option><option value="M" selected>Medium · 15%</option><option value="Q">Quartile · 25%</option><option value="H">High · 30%</option></select></label><label>PNG size<select id="qr-size"><option>256</option><option selected>512</option><option>1024</option></select></label></div><button id="qr-generate" class="chip gold">Generate QR code</button></section><section class="work-panel result-panel"><p id="qr-empty" class="muted">Your QR code will appear here.</p><canvas id="qr-canvas" hidden aria-label="Generated QR code"></canvas><div class="actions"><button id="qr-png" class="chip" disabled>Download PNG</button><button id="qr-svg" class="chip" disabled>Download SVG</button></div></section></div><p id="status" class="status" role="status" aria-live="polite"></p></main>
<footer class="home-footer"><span>yunhan.me</span></footer>
