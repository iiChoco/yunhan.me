<!doctype html>
<!-- math.yunhan.me: the index. Same Instrument as the tools it lists. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>math.yunhan.me</title>
<meta name="description" content="Small math tools by Yunhan Wang.">
<meta name="theme-color" content="#030608">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 128 128'%3E%3Ccircle cx='64' cy='64' r='58' fill='none' stroke='%23e8c98a' stroke-opacity='.5' stroke-width='7' stroke-dasharray='4 12'/%3E%3Ccircle cx='64' cy='64' r='34' fill='none' stroke='%23a0f0ff' stroke-opacity='.7' stroke-width='7'/%3E%3Ccircle cx='64' cy='64' r='12' fill='%23e8c98a'/%3E%3C/svg%3E">
<style>
:root{--line:rgba(140,240,255,.14);--line-strong:rgba(140,240,255,.22);--text:#dfe6e6;--text-dim:rgba(223,230,230,.65);--text-faint:rgba(223,230,230,.34);--gold:#e8c98a;--cyan:#a0f0ff;
--serif:Georgia,"Times New Roman",serif;--mono:ui-monospace,Menlo,Consolas,monospace;--sans:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,sans-serif;
--cut8:polygon(0 0,calc(100% - 8px) 0,100% 8px,100% 100%,8px 100%,0 calc(100% - 8px));--cut12:polygon(0 0,calc(100% - 12px) 0,100% 12px,100% 100%,12px 100%,0 calc(100% - 12px));color-scheme:dark}
*{box-sizing:border-box;margin:0}
body{min-height:100dvh;display:flex;flex-direction:column;background:radial-gradient(120% 85% at 50% -10%,#0b1922 0%,#050c11 55%,#030608 100%) #030608;color:var(--text);font:14.5px/1.55 var(--sans);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
:focus-visible{outline:1px solid rgba(160,240,255,.55);outline-offset:2px}
#scan{position:fixed;inset:0;z-index:50;pointer-events:none;opacity:.3;background:repeating-linear-gradient(180deg,rgba(160,240,255,.05) 0 1px,transparent 1px 3px)}
.corner{position:fixed;z-index:51;width:13px;height:13px;pointer-events:none}
.corner.tl{top:10px;left:10px;border-left:1px solid rgba(232,201,138,.6);border-top:1px solid rgba(232,201,138,.6)}
.corner.tr{top:10px;right:10px;border-right:1px solid rgba(232,201,138,.6);border-top:1px solid rgba(232,201,138,.6)}
.corner.bl{bottom:10px;left:10px;border-left:1px solid rgba(232,201,138,.35);border-bottom:1px solid rgba(232,201,138,.35)}
.corner.br{bottom:10px;right:10px;border-right:1px solid rgba(232,201,138,.35);border-bottom:1px solid rgba(232,201,138,.35)}
header{display:flex;align-items:center;gap:12px;padding:14px 28px;border-bottom:1px solid var(--line)}
.wordmark{font:400 18px/1 var(--serif);letter-spacing:.24em;color:#f3efe6;text-transform:uppercase}
.aperture .c-outer{stroke:rgba(232,201,138,.35)}.aperture .c-mid{stroke:rgba(160,240,255,.5)}.aperture .c-core{fill:rgba(232,201,138,.85)}
main{flex:1;width:100%;max-width:820px;margin:0 auto;padding:36px 28px 40px}
.cap{font:600 10px/1 var(--mono);letter-spacing:.2em;text-transform:uppercase;color:rgba(160,214,235,.55);margin-bottom:14px;display:flex;align-items:center;gap:10px}
.cap::after{content:"";flex:1;height:1px;background:var(--line)}
.tools{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.tool{display:block;border:1px solid var(--line);clip-path:var(--cut12);padding:18px 20px;background:linear-gradient(180deg,rgba(160,240,255,.035),rgba(160,240,255,.012));transition:border-color .15s}
.tool:hover{border-color:rgba(232,201,138,.5)}
.tool .name{font:400 22px/1.2 var(--serif);color:#f7f2e7;padding-left:14px;border-left:1px solid rgba(232,201,138,.5)}
.tool .desc{color:var(--text-dim);margin-top:10px;font-size:13.5px}
.tool .path{margin-top:14px;font:500 9.5px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--text-faint)}
footer{text-align:center;padding:14px 20px 22px;border-top:1px solid var(--line);font:500 9.5px/1.6 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--text-faint)}
footer a{color:var(--gold)}
</style>
</head>
<body>
<div id="scan"></div>
<div class="corner tl"></div><div class="corner tr"></div><div class="corner bl"></div><div class="corner br"></div>
<header>
  <svg class="aperture" width="26" height="26" viewBox="0 0 128 128" aria-hidden="true">
    <circle class="c-outer" cx="64" cy="64" r="58" fill="none" stroke-width="5" stroke-dasharray="4 12"/>
    <circle class="c-mid" cx="64" cy="64" r="34" fill="none" stroke-width="5"/>
    <circle class="c-core" cx="64" cy="64" r="10"/>
  </svg>
  <span class="wordmark">Math</span>
</header>
<main>
  <div class="cap">Tools</div>
  <div class="tools">
    <a class="tool" href="/zetamac">
      <div class="name">Zetamac</div>
      <div class="desc">Arithmetic speed drill. Presets, sprint mode, personal bests, per‑problem timing, shareable settings.</div>
      <div class="path">/zetamac</div>
    </a>
  </div>
</main>
<footer><a href="https://yunhan.me">yunhan.me</a></footer>
</body>
</html>
