[project]
name = "door"
version = "0.1.0"
description = "The front door of yunhan.me: accounts, the site-wide cookie, per-user storage, static sites."
requires-python = ">=3.12"
dependencies = ["aiohttp>=3.10"]

[project.scripts]
door = "door.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["door"]
