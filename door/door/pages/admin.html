<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Accounts · {{SITE}}</title>
<meta name="theme-color" content="#030608">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 128 128'%3E%3Ccircle cx='64' cy='64' r='58' fill='none' stroke='%23e8c98a' stroke-opacity='.5' stroke-width='7' stroke-dasharray='4 12'/%3E%3Ccircle cx='64' cy='64' r='34' fill='none' stroke='%23a0f0ff' stroke-opacity='.7' stroke-width='7'/%3E%3Ccircle cx='64' cy='64' r='12' fill='%23e8c98a'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/instrument.css">
<style>
.secret{font:400 22px/1.3 var(--serif);color:var(--gold);padding-left:16px;border-left:1px solid rgba(232,201,138,.5);user-select:all;word-break:break-all}
td .row{gap:6px;justify-content:flex-end;flex-wrap:nowrap}
tr.off td{color:var(--text-faint)}
</style>
</head>
<body data-site="{{SITE}}">
<div id="scan"></div>
<div class="corner tl"></div><div class="corner tr"></div><div class="corner bl"></div><div class="corner br"></div>
<header>
  <div class="brand">
    <a href="/"><svg class="aperture" width="26" height="26" viewBox="0 0 128 128" aria-hidden="true"><circle class="c-outer" cx="64" cy="64" r="58" fill="none" stroke-width="5" stroke-dasharray="4 12"/><circle class="c-mid" cx="64" cy="64" r="34" fill="none" stroke-width="5"/><circle class="c-core" cx="64" cy="64" r="10"/></svg><span class="wordmark">{{SITE}}</span></a>
    <span class="crumb">/ door / accounts</span>
  </div>
  <span class="spacer"></span>
  <span class="chip" id="me"><span class="dot"></span><span id="meName">…</span></span>
</header>
<main>
  <section class="panel" id="gate" hidden>
    <div class="cap">Owner only</div>
    <p class="muted">Sign in as the owner to manage accounts.</p>
    <p style="margin-top:12px"><a class="chip gold" href="/?next=/admin">Sign in</a></p>
  </section>
  <section class="panel" id="reveal" hidden>
    <div class="cap">New password · shown once</div>
    <div class="secret" id="secret"></div>
    <p class="faint small" style="margin-top:10px">Hand it over out of band. It is not stored anywhere readable.</p>
  </section>
  <section class="panel" id="create" hidden>
    <div class="cap">New account</div>
    <form id="form" class="row" style="gap:10px">
      <input type="text" id="u" placeholder="username" autocapitalize="off" autocorrect="off" spellcheck="false" pattern="[a-z0-9][a-z0-9_-]{1,31}" required>
      <select id="role"><option value="user">user</option><option value="admin">admin</option></select>
      <button class="chip gold" type="submit">Create</button>
      <span class="err" id="err"></span>
    </form>
  </section>
  <section class="panel" id="list" hidden>
    <div class="cap">Accounts</div>
    <table><thead><tr><th>User</th><th>Role</th><th>Created</th><th>Last seen</th><th class="r"></th></tr></thead><tbody id="rows"></tbody></table>
  </section>
</main>
<footer>{{SITE}}</footer>
<div class="toast" id="toast"></div>
<script>
(() => {
const $ = s => document.querySelector(s);
const api = (path, opts = {}) => fetch(path, { credentials: 'same-origin', headers: { 'content-type': 'application/json' }, ...opts });
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let toastT, me = null;
const toast = m => { const t = $('#toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 1800); };
const when = s => s ? s.replace('T', ' ').slice(0, 16) : '—';
function reveal(user, pw) { $('#secret').textContent = `${user} · ${pw}`; $('#reveal').hidden = false; $('#reveal').scrollIntoView({ block: 'nearest' }); }
async function load() {
  const r = await api('/api/admin/accounts');
  if (!r.ok) { $('#gate').hidden = false; return; }
  const { accounts } = await r.json();
  $('#create').hidden = false; $('#list').hidden = false;
  $('#rows').innerHTML = accounts.map(a => `<tr class="${a.disabled ? 'off' : ''}"><td>${esc(a.username)}${a.username === me.username ? ' <span class="faint">(you)</span>' : ''}</td><td class="mono">${esc(a.role)}${a.disabled ? ' · disabled' : ''}</td><td class="num muted">${when(a.created)}</td><td class="num muted">${when(a.last_seen)}</td><td><div class="row">
    <button class="chip" data-act="reset" data-u="${esc(a.username)}">Reset</button>
    ${a.username === me.username ? '' : `<button class="chip" data-act="${a.disabled ? 'enable' : 'disable'}" data-u="${esc(a.username)}">${a.disabled ? 'Enable' : 'Disable'}</button><button class="chip err" data-act="delete" data-u="${esc(a.username)}">Delete</button>`}
  </div></td></tr>`).join('');
}
async function boot() {
  const r = await api('/api/me');
  if (!r.ok) { $('#meName').textContent = 'not signed in'; $('#gate').hidden = false; return; }
  me = await r.json(); $('#meName').textContent = me.username;
  if (!me.admin) { $('#gate').hidden = false; return; }
  load();
}
$('#form').addEventListener('submit', async e => {
  e.preventDefault(); $('#err').textContent = '';
  const r = await api('/api/admin/accounts', { method: 'POST', body: JSON.stringify({ username: $('#u').value.trim().toLowerCase(), role: $('#role').value }) });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) { $('#err').textContent = d.reason || 'failed'; return; }
  reveal(d.account.username, d.password); $('#u').value = ''; load();
});
$('#rows').addEventListener('click', async e => {
  const b = e.target.closest('button[data-act]'); if (!b) return;
  const u = b.dataset.u, act = b.dataset.act;
  if (act === 'delete' && !confirm(`Delete ${u} and their login? Their stored data stays on disk.`)) return;
  if (act === 'reset' && !confirm(`Reset ${u}'s password?`)) return;
  const r = await api(`/api/admin/accounts/${encodeURIComponent(u)}${act === 'delete' ? '' : '/' + act}`, { method: act === 'delete' ? 'DELETE' : 'POST', body: '{}' });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) { toast(d.reason || 'failed'); return; }
  if (act === 'reset') reveal(u, d.password); else toast(`${u} ${act}d`);
  load();
});
boot();
})();
</script>
</body>
</html>
